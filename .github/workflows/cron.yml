# Scheduled invocation of the app's /api/cron/* routes (issue #513).
#
# Production runs on Dokploy, which does not read `vercel.json` — so these
# cron routes declared there had no scheduler at all and every non-payment
# lifecycle job (access-cutoff enforcement, platform-subscription expiry, daily
# digest, league rollover, payment reconciliation) was inert in production.
#
# Each route authenticates with the same `Authorization: Bearer $CRON_SECRET`
# header, including newly added reconciliation workers.
#
# Required repository settings (Settings → Secrets and variables → Actions):
#   secret   CRON_SECRET    — must match the CRON_SECRET env var on the Dokploy app
#   variable CRON_BASE_URL  — the production origin, e.g. https://preciopana.com
# Both are checked at runtime; a missing one fails the run loudly rather than
# silently doing nothing, which is the failure mode this workflow exists to fix.
#
# Caveats worth knowing before relying on this:
#   * GitHub delays scheduled runs under load, and drops high-frequency ones
#     first — the */10 reconcilers are the most affected. If exact cadence
#     matters for those, prefer a Dokploy scheduled task (see docs/DEPLOYMENT.md).
#   * GitHub disables scheduled workflows after 60 days with no repository
#     activity. Re-enable from the Actions tab if that happens.
#   * Run ONE mechanism. If a Dokploy schedule is added later, remove the
#     corresponding schedule here so routes don't fire twice.
#
# Runs report to Sentry cron monitors (slug `cron-<route>`) so a run that never
# happens is visible — a disabled workflow or a dropped tick fails nothing and
# logs nothing, so job failure alone cannot catch it.
#
# Operating this: docs/CRON_RUNBOOK.md (scheduler of record, replay, secret
# rotation, partial failure, and why solana-pull is dispatch-only).

name: Scheduled cron routes

on:
  schedule:
    # Keep these in sync with vercel.json and with the case block below.
    - cron: '*/10 * * * *' # payment + webhook + activation reconcilers
    - cron: '0 * * * *' # daily-digest — hourly by design (each tenant sends at its own local hour)
    - cron: '0 0 * * *' # expire-subscriptions
    - cron: '0 1 * * 1' # league-rollover (pg_cron also runs it Mondays 00:05; this is the fallback)
    - cron: '0 2 * * *' # expire-platform-subscriptions
    - cron: '0 3 * * *' # enforce-plan-limits
  workflow_dispatch:
    inputs:
      route:
        description: 'Cron route to run now'
        required: true
        type: choice
        options:
          - enforce-plan-limits
          - expire-platform-subscriptions
          - expire-subscriptions
          - daily-digest
          - league-rollover
          - solana-reconcile
          - binance-personal-reconcile
          - redeliver-webhook-events
          - reconcile-solana-platform-activations
          # Never scheduled: solana-pull submits on-chain USDC transfers and has
          # never had a scheduler in vercel.json either. Available here for
          # manual runs only — putting it on a timer needs its own review.
          - solana-pull

permissions:
  contents: read

concurrency:
  # Serialize per trigger so a slow run can't overlap the next tick.
  group: cron-${{ github.event.schedule || inputs.route }}
  cancel-in-progress: false

jobs:
  invoke:
    name: Invoke cron route(s)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve routes for this trigger
        id: resolve
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_ROUTE: ${{ inputs.route }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_ROUTE:-}" ]; then
            routes="$DISPATCH_ROUTE"
          else
            case "${SCHEDULE:-}" in
              '*/10 * * * *') routes='solana-reconcile binance-personal-reconcile redeliver-webhook-events reconcile-solana-platform-activations' ;;
              '0 * * * *')    routes='daily-digest' ;;
              '0 0 * * *')    routes='expire-subscriptions' ;;
              '0 1 * * 1')    routes='league-rollover' ;;
              '0 2 * * *')    routes='expire-platform-subscriptions' ;;
              '0 3 * * *')    routes='enforce-plan-limits' ;;
              *)
                echo "::error::Schedule '${SCHEDULE:-}' has no route mapping. Add it to the case block in .github/workflows/cron.yml."
                exit 1
                ;;
            esac
          fi
          echo "Resolved routes: $routes"
          echo "routes=$routes" >> "$GITHUB_OUTPUT"

      - name: Invoke
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_BASE_URL: ${{ vars.CRON_BASE_URL }}
          SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          ROUTES: ${{ steps.resolve.outputs.routes }}
          MONITOR_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_BASE_URL:-}" ]; then
            echo "::error::Repository variable CRON_BASE_URL is not set (expected e.g. https://preciopana.com)."
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repository secret CRON_SECRET is not set. It must match the CRON_SECRET env var on the Dokploy app."
            exit 1
          fi

          # ---- Sentry Crons monitoring (issue #620) ----
          #
          # A failed run already fails this job, and GitHub emails on that. What
          # that cannot catch is the run that never happened: a workflow
          # disabled by hand, a dropped */10 tick, or the 60-day inactivity
          # shutdown that silently turned this file off once already. Sentry
          # cron monitors close that gap — one monitor per route, and a check-in
          # that never arrives raises an issue by itself.
          #
          # Ingest host, project id and public key are derived from the DSN
          # (https://<key>@<host>/<project_id>) rather than written out, for the
          # same reason Sentry.init reads it from the environment.
          #
          # One terminal check-in per route, no in_progress: the ingest endpoint
          # answers 202 with an EMPTY body, so there is no check-in id to close
          # a started run with. Verified against the live project — opening one
          # and never closing it just leaves every run hanging.
          #
          # Monitoring is strictly additive. Every call swallows its own errors,
          # because an unreachable Sentry must never fail a billing job.
          checkin_url_base=''
          checkin_margin=120
          if [ -z "${MONITOR_SCHEDULE:-}" ]; then
            echo "Manual run — no schedule to check in against, skipping Sentry monitors."
          elif [ -z "${SENTRY_DSN:-}" ]; then
            echo "::warning::NEXT_PUBLIC_SENTRY_DSN is not set — this run is unmonitored."
          else
            sentry_key="${SENTRY_DSN#*//}"; sentry_key="${sentry_key%%@*}"
            sentry_rest="${SENTRY_DSN##*@}"
            checkin_url_base="https://${sentry_rest%%/*}/api/${sentry_rest##*/}/cron"
            # GitHub delays scheduled runs under load and drops high-frequency
            # ones first, so the */10 group needs a wider margin than the daily
            # jobs or every busy hour pages us. Misses that persist here are the
            # signal to move to a Dokploy schedule — see docs/CRON_RUNBOOK.md.
            case "$MONITOR_SCHEDULE" in
              '*/10 * * * *') checkin_margin=30 ;;
            esac
          fi

          # $1 route, $2 ok|error. Upserts the monitor so its schedule in Sentry
          # can never drift from the schedule that actually invoked it.
          checkin() {
            [ -n "$checkin_url_base" ] || return 0
            curl -sS --max-time 15 -o /dev/null -X POST \
              -H 'Content-Type: application/json' \
              -d "{\"status\":\"$2\",\"monitor_config\":{\"schedule\":{\"type\":\"crontab\",\"value\":\"$MONITOR_SCHEDULE\"},\"checkin_margin\":$checkin_margin,\"max_runtime\":20,\"timezone\":\"Etc/UTC\"}}" \
              "$checkin_url_base/cron-$1/$sentry_key/" 2>/dev/null || true
          }

          base="${CRON_BASE_URL%/}"
          failed=0

          for route in $ROUTES; do
            url="$base/api/cron/$route"
            echo "--- GET $url"
            # Cleared per route: curl writes no body when it cannot connect, so
            # a leftover file would print the PREVIOUS route's response under
            # this route's failure — exactly the wrong thing during an incident.
            rm -f /tmp/cron-body.txt
            # The secret is passed via env into the header and never printed;
            # GitHub also masks it in logs. Body is capped so a large digest
            # response can't flood the log.
            code="$(curl -sS -o /tmp/cron-body.txt -w '%{http_code}' \
              --max-time 600 --retry 2 --retry-delay 15 --retry-connrefused \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$url")" || code='000'

            echo "HTTP $code"
            head -c 2000 /tmp/cron-body.txt 2>/dev/null || true
            echo

            if [ "$code" = '200' ]; then
              checkin "$route" ok
            else
              checkin "$route" error
              echo "::error::$route returned HTTP $code"
              failed=1
            fi
          done

          exit "$failed"
